<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            #container {
                height: 100%;
                height: 100vh;
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
            }

            .box {
                width: 100px;
                height: 100px;
                border: 1px solid black;
            }

            .yellow {
                background-color: yellow;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </body>
    <script>
        const boxes = document.querySelectorAll(".box");
        console.log(boxes);
        // foreach ha come altro parametri opzionali:
        // l'oggetto che sta scorrendo;
        // l'indice dell'oggetto che sta iterando;
        // l'array su cui si sta eseguendo il foreach().
        boxes.forEach((box, index, array)=> {
            console.log(`recupero box ${index} di ${array}`);
            box.addEventListener("click", (event)=> {
                console.log("toggle classe box");
                event.currentTarget.classList.toggle("yellow");
            });
        });
    </script>
</html>
