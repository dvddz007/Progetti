<!DOCTYPE html>
<!--
    Realizzare una pagina HTML con 3 div con dentro rispettivamente "1", "2", e "3". Un tasto "start" posizionato al centro sotto i div.
    Quando l'utente clicca su start bisogna generare una sequenza random di 5 numeri compresi tra 1 e 3
    e mostrarli all'utente (in apposito div o paragrafo) per 4 secondi.
    Passati i 4 secondi l'utente ha 5 secondi per riprodurre la sequenza cliccando sui div.
    Se riproduce correttamente la sequenza generare un messaggio di successo altrimenti di fallimento.
-->
    <html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Segui la sequenza</title>
        <script src="script.js" defer></script>
    </head>
    <style>
        :root {
            --bodyBg: #080D18;
            --containerBg: #111C2E;
            --containerBorder: #26354B;
            --textColor: #E7EDF7;
            --box1bg: red;
            --box1hover: #cc0000;
            --box1active: #990000;
            --box2bg: blue;
            --box2hover: #0000cc;
            --box2active: #000099;
            --box3bg: green;
            --box3hover: #006600;
            --box3active: #004d00;
            --btnsBg: #0095ff;
            --btnsHover: #07c;
            --btnsActive: #0064bd;
            --box4bg: #ea580c;
            --box4hover: #c2410c;
            --box4active: #9a3412;
            --box5bg: #9333ea;
            --box5hover: #7e22ce;
            --box5active: #6b21a8;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bodyBg);
            color: var(--textColor);
        }

        #container {
            width: 750px;
            height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 50px;
            background: var(--containerBg);
            border: 1px solid var(--containerBorder);
            border-radius: 10px;
        }

        #sequenzaBox {
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 20px;
        }        

        #sequenza {
            display: flex;
            flex-direction: row;
            justify-content: center;
            font-size: 25px;
            gap: 8px;
        }

        #sequenza.hidden {
            visibility: hidden;
        }

        #combinazioneBox {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 50px;
        }

        #combinazioneBox > .box {
            border: 1px solid transparent;
            padding: 25px 30px;
            border-radius: 5px;
            color: #ffffff;
        }

        #combinazioneBox .box:nth-child(1) {
            background-color: var(--box1bg);
        }

        #combinazioneBox .box:nth-child(1):hover {
            background-color: var(--box1hover);
        }

        #combinazioneBox .box:nth-child(1):active {
            background-color: var(--box1active);
        }

        #combinazioneBox .box:nth-child(2) {
            background-color: var(--box2bg);
        }

        #combinazioneBox .box:nth-child(2):hover {
            background-color: var(--box2hover);
        }

        #combinazioneBox .box:nth-child(2):active {
            background-color: var(--box2active);
        }

        #combinazioneBox .box:nth-child(3) {
            background-color: var(--box3bg);
        }

        #combinazioneBox .box:nth-child(3):hover {
            background-color: var(--box3hover);
        }

        #combinazioneBox .box:nth-child(3):active {
            background-color: var(--box3active);
        }
        
        #combinazioneBox .box:nth-child(4) {
            background-color: var(--box4bg);
        }

        #combinazioneBox .box:nth-child(4):hover {
            background-color: var(--box4hover);
        }

        #combinazioneBox .box:nth-child(4):active {
            background-color: var(--box4active);
        }

        #combinazioneBox .box:nth-child(5) {
            background-color: var(--box5bg);
        }

        #combinazioneBox .box:nth-child(5):hover {
            background-color: var(--box5hover);
        }

        #combinazioneBox .box:nth-child(5):active {
            background-color: var(--box5active);
        }

        #startBtn, #deleteBtn {
            background-color: var(--btnsBg);
            border: 1px solid transparent;
            padding: 15px 18px;
            border-radius: 5px;
            color: #ffffff;
        }

        #startBtn.hidden, #deleteBtn.hidden {
            visibility: hidden;
        }

        #startBtn:hover, #deleteBtn:hover {
            background-color: var(--btnsHover);
        }

        #startBtn:active, #deleteBtn:active {
            background-color: var(--btnsActive);
        }

        .vinto, .corretto {
            color: green;
        }

        .perso, .errato {
            color: red;
        }
    </style>
    <body>
        <div id="container">
            <div id="sequenzaBox">
                <p id="testo">Clicca per iniziare</p>
                <div id="sequenza" class="hidden">
                    <div class="sequenzaNums"></div>
                    <div class="sequenzaNums"></div>
                    <div class="sequenzaNums"></div>
                    <div class="sequenzaNums"></div>
                    <div class="sequenzaNums"></div>
                </div>
            </div>
            <div id="combinazioneBox">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
                <div class="box">5</div>
            </div>
            <input type="button" id="startBtn" value="START">
            <input type="button" id="deleteBtn" class="hidden" value="CANCELLA">
        </div>
    </body>
</html>
