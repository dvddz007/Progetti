

<!DOCTYPE html>
<!--
    Il tempo visualizzato dev'essere nel formato HH:MM:SS (ore minuti secondi).
    Aggiungere un pulsante "intermedio" che se premuto fa un freeze del cronometro per 5 secondi (in modo che l'utente possa visualizzare il tempo intermedio),
    passati i quali deve tornare visibile il cronometro normalmente. Durante 'intermedio il conteggio non si deve interrompere.
-->
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="script.js" defer></script>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }

            #container {
                width: 100%;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .row {
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
            }

            .col {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            #btnContainer {
                margin-top: 30px;
            }

            #startBtn {
                background-color: blue;
                margin-right: 50px;
            }

            #intermedioBtn {
                background-color: red;
            }

            input[type="button"] {
                padding: 10px 20px;
                color: white;
                border: none;
                border-radius: 10px;
            }

            input[type="button"]:hover {
                transform: scale(1.1);
                transition: transform 0.2s;
            }

            #startBtn:hover {
                background-color: darkblue;
            }

            #stopBtn:hover {
                background-color: darkred;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div class="row">
                <h1 id="hh">00</h1>
                :
                <h1 id="mm">00</h1>
                :
                <h1 id="ss">00</h1>
            </div>
            <div class="row" id="btnContainer">
                <input type="button" value="START" id="startBtn" onclick="start();">
                <input type="button" value="INTERMEDIO" id="intermedioBtn" onclick="intermedio();">
            </div>
        </div>
    </body>
</html>
