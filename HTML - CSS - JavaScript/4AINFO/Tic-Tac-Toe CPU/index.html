<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Tic-Tac-Toe</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Punti giocatore 1:<span id="p1Points">0</span></h1>
                <h1>è il turno di:<span id="turn"></span></h1>
                <h1>Punti giocatore 2:<span id="p2Points">0</span></h1>
            </div>
            <div class="content">
                <div class="matrice">
                    <div class="box">
                        <div id="box1"></div>
                        <div id="box2"></div>
                        <div id="box3"></div>
                    </div>
                    <div class="box">
                        <div id="box4"></div>
                        <div id="box5"></div>
                        <div id="box6"></div>
                    </div>
                    <div class="box">
                        <div id="box7"></div>
                        <div id="box8"></div>
                        <div id="box9"></div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <input type="button" value="RESET" onclick="resetMatrix(true)">
            </div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
