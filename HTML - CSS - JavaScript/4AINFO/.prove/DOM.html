<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Document Object Model</title>
        <style>
            body {
                font-family: Arial, sans-serif;
            }

            .container {
                display: flex;
                flex-direction: column;
                height: 300px;
                border: 1px solid;
            }

            .container p {
                display: flex;
                flex-direction: row;
                flex-grow: 1;
                justify-content: center;
                align-items: center;
                font-size: 20px;
                margin: 0;      /* rimuove il margine di default dei paragrafi (16px) */
            }

            .centrato {
                text-align: center;
                margin-bottom: 50px;
            }
        </style>
    </head>
    <body>
    <h1 class="centrato" id="text"> </h1>
    <div class="container">
        <p id="1st">Lorem</p>
        <p id="2nd">ipsum</p>
        <p id="3rd">dolor</p>
    </div>

    <script>
        let testo = document.getElementById("text");
        testo.innerHTML = "I colori della bandiera olandese";

        document.getElementById("1st").style.backgroundColor = "lightgrey";
        document.getElementById("1st").style.color = "red";

        document.getElementById("2nd").style.backgroundColor = "lightgrey";
        document.getElementById("2nd").style.color = "white";

        document.getElementById("3rd").style.backgroundColor = "lightgrey";
        document.getElementById("3rd").style.color = "blue";
    </script>
    </body>
</html>
